name = "gbl"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The website files (index.html etc.) live in ./public.
[assets]
directory = "./public"
binding = "ASSETS"
# Unknown pages show the neon "Game Over" page.
not_found_handling = "404-page"
# The server handles the API, and the home page (to fill in share-preview links).
run_worker_first = ["/api/*", "/"]

# The database for accounts, scores and submissions.
# This is your D1 database (games-by-levi) on Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "games-by-levi"
database_id = "91bf4ccf-de67-4f01-a549-caa968d7a297"

[vars]
# The account with this username is the admin who approves and rejects submitted games.
# Sign up with this name right after you deploy, before anyone else can take it.
ADMIN_USERNAME = "Levi"
